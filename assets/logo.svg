<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- vibe-pilot mark: the glideslope V -->
  <defs>
    <clipPath id="tile">
      <rect x="16" y="16" width="480" height="480" rx="108"/>
    </clipPath>
  </defs>

  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="#0A0F0D"/>
  <rect x="22" y="22" width="468" height="468" rx="102" fill="none" stroke="#14251D" stroke-width="4"/>

  <!-- radar rings -->
  <g clip-path="url(#tile)" fill="none" stroke="#163025" stroke-width="2" stroke-opacity="0.9">
    <circle cx="256" cy="256" r="248"/>
    <circle cx="256" cy="256" r="196"/>
    <circle cx="256" cy="256" r="144"/>
  </g>

  <!-- raw context arm (dim): the expensive descent -->
  <line x1="128" y1="132" x2="256" y2="352" stroke="#2E8F63" stroke-width="38" stroke-linecap="round"/>

  <!-- optimized context arm (bright): the lean ascent -->
  <line x1="256" y1="352" x2="384" y2="132" stroke="#3DFFA2" stroke-width="38" stroke-linecap="round"/>

  <!-- the pilot waypoint: the agent at the vertex -->
  <circle cx="256" cy="352" r="30" fill="#0A0F0D" stroke="#E9FFF4" stroke-width="13"/>

  <!-- altitude ticks -->
  <g stroke="#2E8F63" stroke-width="9" stroke-linecap="round" opacity="0.85">
    <line x1="84" y1="132" x2="112" y2="132"/>
    <line x1="400" y1="132" x2="428" y2="132"/>
  </g>
</svg>
